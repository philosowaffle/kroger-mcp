name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Format check
        run: |
          if [ -n "$(gofmt -l ./...)" ]; then
            echo "The following files need formatting:"
            gofmt -l ./...
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Check for tmp/ directory
        run: |
          if [ -d tmp ]; then
            echo "ERROR: tmp/ directory must be deleted before merge"
            exit 1
          fi

  semantic-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
