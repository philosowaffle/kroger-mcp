name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files need formatting:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          # Integration tests only build with their tag; vet them too so they
          # can't rot even when the integration job has no credentials.
          go vet -tags integration ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Docker build
        run: docker build -t kroger-mcp:ci .

      - name: Check for tmp/ directory
        run: |
          if [ -d tmp ]; then
            echo "ERROR: tmp/ directory must be deleted before merge"
            exit 1
          fi

  integration:
    name: integration (Kroger certification API)
    runs-on: ubuntu-latest
    # Only spend Kroger API quota once format, vet, lint, build and unit
    # tests have passed.
    needs: checks
    # One run at a time per PR, so pushes don't pile up calls to Kroger.
    concurrency:
      group: integration-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Integration tests
        env:
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CERT_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CERT_CLIENT_SECRET }}
          KROGER_API_BASE_URL: https://api-ce.kroger.com/v1
          KROGER_TEST_ZIP: ${{ vars.KROGER_TEST_ZIP }}
        run: |
          # Secrets aren't available to pull requests from forks.
          if [ -z "$KROGER_CLIENT_ID" ] || [ -z "$KROGER_CLIENT_SECRET" ]; then
            echo "::warning::KROGER_CERT_CLIENT_ID / KROGER_CERT_CLIENT_SECRET are not set; skipping integration tests"
            exit 0
          fi
          go test -tags integration -count=1 -v ./integration/...

  semantic-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
