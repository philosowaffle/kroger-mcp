name: PR Checks

on:
  pull_request:
    branches: [main]

# Jobs widen this as they need to.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Newest 1.26 patch, so builds and govulncheck get stdlib security
          # fixes. go.mod's `go` line is only the minimum language version.
          go-version: "1.26.x"
          check-latest: true

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files need formatting:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          # Integration tests only build with their tag; vet them too so they
          # can't rot even when the integration job has no credentials.
          go vet -tags integration ./...

      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # Pinned so a new golangci-lint release can't break CI unannounced.
          # Keep in step with the version contributors run locally.
          version: v2.14.0

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Docker build
        run: docker build -t kroger-mcp:ci .

      - name: Check for tmp/ directory
        run: |
          if [ -d tmp ]; then
            echo "ERROR: tmp/ directory must be deleted before merge"
            exit 1
          fi

  integration:
    name: integration (Kroger certification API)
    runs-on: ubuntu-latest
    # Only spend Kroger API quota once format, vet, lint, build and unit
    # tests have passed.
    needs: checks
    # One run at a time per PR, so pushes don't pile up calls to Kroger.
    concurrency:
      group: integration-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Newest 1.26 patch, so builds and govulncheck get stdlib security
          # fixes. go.mod's `go` line is only the minimum language version.
          go-version: "1.26.x"
          check-latest: true

      - name: Integration tests
        env:
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CERT_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CERT_CLIENT_SECRET }}
          KROGER_API_BASE_URL: https://api-ce.kroger.com/v1
          KROGER_TEST_ZIP: ${{ vars.KROGER_TEST_ZIP }}
        run: |
          # Secrets aren't available to pull requests from forks.
          if [ -z "$KROGER_CLIENT_ID" ] || [ -z "$KROGER_CLIENT_SECRET" ]; then
            echo "::warning::KROGER_CERT_CLIENT_ID / KROGER_CERT_CLIENT_SECRET are not set; skipping integration tests"
            exit 0
          fi
          go test -tags integration -count=1 -v ./integration/...

  semantic-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
