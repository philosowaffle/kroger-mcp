name: Release

# Three ways in:
#   - Actions → Release → "Run workflow" with a version: tags main and releases.
#   - Pushing a vX.Y.Z tag: releases that tag.
#   - Merging to main: publishes a `main` image only (no GitHub release).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (a new tag on main)"
        required: true
        type: string

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kroger-mcp

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Works out what this run is, and for a manual run creates the tag.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.mode.outputs.release }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve mode
        id: mode
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            workflow_dispatch:refs/heads/main)
              version="$INPUT_VERSION" ;;
            workflow_dispatch:*)
              echo "::error::Run the release from main, not $GITHUB_REF_NAME"; exit 1 ;;
            push:refs/tags/*)
              version="$GITHUB_REF_NAME" ;;
            *)
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.2.3, got '$version'"; exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Tags pushed with GITHUB_TOKEN don't start new workflow runs, so this
      # run carries on with the release itself.
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.mode.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"; exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

  image:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Release: 1.2.3, 1.2, latest.  Merge to main: main, sha-abc1234.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.release == 'true' }}
            type=raw,value=main,enable=${{ needs.prepare.outputs.release != 'true' }}
            type=sha,enable=${{ needs.prepare.outputs.release != 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [prepare, image]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --current --strip header

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -o dist/kroger-mcp-linux-amd64   .
          GOOS=linux   GOARCH=arm64 go build -o dist/kroger-mcp-linux-arm64   .
          GOOS=darwin  GOARCH=arm64 go build -o dist/kroger-mcp-darwin-arm64  .
          GOOS=windows GOARCH=amd64 go build -o dist/kroger-mcp-windows-amd64.exe .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          body: |
            ${{ steps.cliff.outputs.content }}

            **Image:** `docker pull ${{ env.IMAGE }}:${{ env.VERSION }}`
          files: dist/*

  # Separate job so a failure here (e.g. a protected main branch) doesn't hide
  # a successful release.
  changelog:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      # Pushed with GITHUB_TOKEN, so this commit doesn't trigger another run.
      - name: Commit CHANGELOG.md
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: update CHANGELOG.md for $VERSION"
          git push origin HEAD:main
