name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate changelog
        uses: orhun/git-cliff-action@v3
        id: cliff
        with:
          config: cliff.toml
          args: --current

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -o dist/kroger-mcp-linux-amd64   .
          GOOS=linux   GOARCH=arm64 go build -o dist/kroger-mcp-linux-arm64   .
          GOOS=darwin  GOARCH=arm64 go build -o dist/kroger-mcp-darwin-arm64  .
          GOOS=windows GOARCH=amd64 go build -o dist/kroger-mcp-windows-amd64.exe .

      - name: Build Docker image
        run: docker build -t kroger-mcp:${{ github.ref_name }} .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.cliff.outputs.content }}
          files: dist/*

      - name: Update CHANGELOG.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git-cliff --output CHANGELOG.md
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: update CHANGELOG.md for ${{ github.ref_name }}"
          git push origin HEAD:main
