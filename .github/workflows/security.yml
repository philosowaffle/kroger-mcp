name: Security

# Dependency and code scanning. Runs on PRs, on main, and weekly so new
# advisories against unchanged code still surface.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Jobs widen this as they need to.
permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: hashFiles('go.mod') != ''
        with:
          # Newest 1.26 patch, so builds and govulncheck get stdlib security
          # fixes. go.mod's `go` line is only the minimum language version.
          go-version: "1.26.x"
          check-latest: true

      # Fails only on vulnerabilities in code the module actually calls.
      # Skips until the repo has a go.mod, so the template itself stays green.
      - name: govulncheck
        if: hashFiles('go.mod') != ''
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  codeql:
    # Uploading results to a private repo needs GitHub Advanced Security, so
    # this waits until the repo is public. The weekly run is govulncheck's;
    # CodeQL only needs to see code changes.
    #
    # This is CodeQL's advanced setup. GitHub rejects its uploads while the
    # repo's default setup is on, so leave Settings → Code security → CodeQL
    # on "Advanced" and don't add GitHub's starter codeql.yml as well.
    if: ${{ github.event_name != 'schedule' && !github.event.repository.private }}
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          # The workflows themselves: injection, unpinned actions, broad tokens.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.language == 'go' && hashFiles('go.mod') != ''
        with:
          # Newest 1.26 patch, so builds and govulncheck get stdlib security
          # fixes. go.mod's `go` line is only the minimum language version.
          go-version: "1.26.x"
          check-latest: true

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
