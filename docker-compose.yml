# Sample compose for self-hosting kroger-mcp.
#
#   docker compose up -d         # pull + run the published image
#   docker compose up -d --build # build from local source instead (uncomment build: below)
#
# Put KROGER_CLIENT_ID / KROGER_CLIENT_SECRET in a .env file next to this one
# (gitignored) or export them in your shell; compose substitutes them below.
#
# Connect Claude:  claude mcp add --transport http kroger http://<host>:8080

services:
  kroger-mcp:
    image: ghcr.io/philosowaffle/kroger-mcp:latest
    # Uncomment to build from the source in this folder instead of pulling:
    # build: .
    container_name: kroger-mcp
    restart: unless-stopped
    ports:
      # Loopback only: reachable from this machine, not the network. Without
      # MCP auth, anyone who can reach the port can add to your cart or link
      # their own Kroger account in place of yours. To expose it, set up MCP
      # auth below (preferred), or publish "8080:8080" on a trusted network.
      - "127.0.0.1:8080:8080"
    environment:
      KROGER_MCP_ADDR: ":8080"
      # The server refuses to listen beyond loopback without MCP auth unless
      # this is set. Inside the container it must listen on all interfaces for
      # the port mapping to work; the loopback-only publish above is what keeps
      # it private. Remove this once KROGER_MCP_OIDC_ISSUER is set.
      KROGER_MCP_ALLOW_UNAUTHENTICATED: "true"
      # KROGER_MCP_LOG_LEVEL: "info"   # set "trace" for per-request logs
      # --- Kroger developer app (required) ---
      KROGER_CLIENT_ID: "${KROGER_CLIENT_ID:?set KROGER_CLIENT_ID}"
      KROGER_CLIENT_SECRET: "${KROGER_CLIENT_SECRET:?set KROGER_CLIENT_SECRET}"
      # Must exactly match a redirect URI registered on the Kroger app.
      KROGER_REDIRECT_URI: "${KROGER_REDIRECT_URI:-http://localhost:8080/kroger/callback}"
      # --- Shopping defaults (optional) ---
      # KROGER_LOCATION_ID: ""          # or ask Claude to set_preferred_location
      # KROGER_MODALITY: "PICKUP"       # PICKUP or DELIVERY
      # --- MCP auth (optional) ---
      # Set an OIDC issuer to require OAuth bearer tokens (protected resource).
      # Leave unset to run unauthenticated (loopback or a trusted network
      # only). See README "Authentication".
      # KROGER_MCP_OIDC_ISSUER: "https://auth.example.com"
      # KROGER_MCP_OIDC_RESOURCE: "https://kroger-mcp.example.com"
      # KROGER_MCP_OIDC_SCOPES: "mcp"
    volumes:
      # Holds the linked Kroger account's tokens. A named volume inherits the
      # image's nonroot ownership; for a bind mount, chown the host directory
      # to 65532:65532 first.
      - kroger-data:/data
    # The image ships its own HEALTHCHECK (the binary probes /healthz).

volumes:
  kroger-data:
